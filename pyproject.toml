[project]
name = "labguardian-server"
version = "0.1.0"
description = "LabGuardian 统一后端 — 检测→映射→拓扑→检错 四阶段 Pipeline"
requires-python = ">=3.11"
dependencies = [
    # --- Web 框架 ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    # --- 异步任务 ---
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # --- 视觉 & AI ---
    "ultralytics>=8.2.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "networkx>=3.2",
    "scikit-image>=0.22.0",
    # --- 数据库 (预留) ---
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # --- 工具 ---
    "httpx>=0.27.0",
    "pillow>=10.0.0",

    # --- LangChain RAG (Datasheet KB) ---
    "langchain>=0.2.16",
    "langchain-community>=0.2.16",
    "langchain-openai>=0.1.14",
    "chromadb>=0.5.0",
    "pypdf>=4.2.0",
    "cryptography>=3.1",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "httpx>=0.27.0",
]
edge = [
    "openvino-genai>=2025.0.0",
]
# Build-time only — used by scripts/ingest_datasheets.py to parse PDFs into
# DatasheetDocument JSON on a developer / CI machine. NEVER install these on
# the board: MinerU pulls layout/OCR model weights and PyTorch. The runtime
# only reads the produced JSON + assets, so the on-device container should
# exclude this extra entirely.
ingest = [
    "mineru[core]>=2.0.0; python_version<'3.13'",
    "pypdf>=4.0",
]
# Datasheet KB v2 — Phase 3 hybrid retrieval. On the board, only `openvino`
# and `tokenizers` are required at runtime (they already ship for vlm_service
# and Chroma respectively). Chunk-side embeddings are pre-computed offline
# by `scripts/build_datasheet_embeddings.py`; nothing here is needed on the
# board to *re-compute* them.
embedding = [
    "openvino>=2024.0",
    "tokenizers>=0.20",
    "numpy>=1.26",
]
# Build-time only: model conversion (HF Transformers → OpenVINO IR). Run on a
# developer machine to produce the `models/bge-small-zh-v1.5-int8-ov/` IR.
embedding-build = [
    "optimum[openvino]>=1.20",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
