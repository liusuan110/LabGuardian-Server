[project]
name = "labguardian-server"
version = "0.1.0"
description = "LabGuardian 统一后端 — 检测→映射→拓扑→检错 四阶段 Pipeline"
requires-python = ">=3.11"
dependencies = [
    # --- Web 框架 ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    # --- 异步任务 ---
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # --- 视觉 & AI ---
    "ultralytics>=8.2.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "networkx>=3.2",
    "scikit-image>=0.22.0",
    # --- 数据库 (预留) ---
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # --- 工具 ---
    "httpx>=0.27.0",
    "pillow>=10.0.0",

    # --- LangChain RAG (Datasheet KB) ---
    "langchain>=0.2.16",
    "langchain-community>=0.2.16",
    "langchain-openai>=0.1.14",
    "chromadb>=0.5.0",
    "pypdf>=4.2.0",
    "cryptography>=3.1",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "httpx>=0.27.0",
]
edge = [
    "openvino-genai>=2025.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
