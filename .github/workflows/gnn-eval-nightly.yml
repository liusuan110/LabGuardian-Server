# LabGuardian-Server · P5 nightly false_pass gate
#
# Runs `scripts/gnn_eval_nightly.sh` on a schedule + on changes to the
# rule comparator or GNN advisor surface. Goal: catch any regression in
# `rule_false_pass_rate` (plan §八 red line, 0.005) the same day it
# lands. See docs/CI_NIGHTLY.md for the rationale + manual cron
# alternative for self-hosted setups.
#
# Exit code conventions (mirrored from the script):
#   0 = both splits passed
#   3 = false_pass exceeded gate → workflow fails red
#   4 = dataset / ckpt missing → workflow stays green with a warning
#
# Required workflow inputs (env / secrets):
#   GNN_EVAL_DATASET_URL   (optional) tarball of datasets/circuit_compare
#   GNN_EVAL_CKPT_URL      (optional) URL to checkpoints/p3_followup_v2/best_f1.pt
#
# When neither is set the job exits 4 (skip) — useful for the first
# wiring before the team decides where dataset/ckpt artifacts live.

name: gnn-eval-nightly

on:
  schedule:
    # Daily at 03:00 UTC (~11:00 CST). Adjust to your team's calm window.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      false_pass_gate:
        description: "rule_false_pass_rate ceiling (default 0.005)"
        default: "0.005"
        type: string
      skip_if_missing_data:
        description: "Exit 4 (skip) when dataset/ckpt missing? (1=yes, 0=fail hard)"
        default: "1"
        type: string
  push:
    paths:
      - "app/domain/compare/**"
      - "app/domain/gnn/inference.py"
      - "app/domain/gnn/evaluator.py"
      - "scripts/gnn_eval.py"
      - "scripts/gnn_eval_nightly.sh"
      - ".github/workflows/gnn-eval-nightly.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FALSE_PASS_GATE: ${{ inputs.false_pass_gate || '0.005' }}
      SKIP_IF_MISSING_DATA: ${{ inputs.skip_if_missing_data || '1' }}
      PYTHON: python3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + extras
        run: |
          python -m pip install --upgrade pip
          # Install with [gnn] extras (torch + torch-geometric). For
          # CPU-only CI this is fine; torch CPU wheels are ~200MB.
          pip install -e ".[gnn,dev]"

      - name: Fetch dataset (if URL provided)
        if: env.GNN_EVAL_DATASET_URL != ''
        env:
          GNN_EVAL_DATASET_URL: ${{ secrets.GNN_EVAL_DATASET_URL }}
        run: |
          mkdir -p datasets/circuit_compare
          curl -fsSL "$GNN_EVAL_DATASET_URL" | tar -xz -C datasets/circuit_compare

      - name: Fetch checkpoint (if URL provided)
        if: env.GNN_EVAL_CKPT_URL != ''
        env:
          GNN_EVAL_CKPT_URL: ${{ secrets.GNN_EVAL_CKPT_URL }}
        run: |
          mkdir -p checkpoints/p3_followup_v2
          curl -fsSL "$GNN_EVAL_CKPT_URL" \
              -o checkpoints/p3_followup_v2/best_f1.pt

      - name: Run nightly evaluator
        id: eval
        run: |
          set +e
          bash scripts/gnn_eval_nightly.sh
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ ${rc} -eq 4 ]; then
            echo "::warning::Nightly skipped — dataset or checkpoint missing. Set GNN_EVAL_DATASET_URL / GNN_EVAL_CKPT_URL secrets to enable."
            exit 0
          fi
          exit ${rc}

      - name: Upload metrics
        if: always() && steps.eval.outputs.rc != '4'
        uses: actions/upload-artifact@v4
        with:
          name: p5-eval-${{ github.run_id }}
          path: |
            checkpoints/p5_eval/metrics.json
            checkpoints/p5_eval/report.md
            checkpoints/p5_eval_val/metrics.json
            checkpoints/p5_eval_val/report.md
            checkpoints/p5_eval_rule_only/metrics.json
            checkpoints/p5_eval_rule_only/report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarise on PR
        if: github.event_name == 'pull_request' && steps.eval.outputs.rc != '4' && always()
        run: |
          {
            echo "## P5 nightly evaluator"
            echo
            for d in checkpoints/p5_eval checkpoints/p5_eval_val checkpoints/p5_eval_rule_only; do
              if [ -f "${d}/metrics.json" ]; then
                fp=$(python -c "import json; print(f\"{json.load(open('${d}/metrics.json'))['rule_false_pass_rate']:.4f}\")")
                acc=$(python -c "import json; print(f\"{json.load(open('${d}/metrics.json'))['rule_accuracy']:.4f}\")")
                echo "- \`${d}\`: false_pass=**${fp}** accuracy=${acc}"
              fi
            done
            echo
            echo "Gate: \`rule_false_pass_rate ≤ ${FALSE_PASS_GATE}\` (plan §八)"
          } >> "$GITHUB_STEP_SUMMARY"
