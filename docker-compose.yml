services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LABGUARDIAN_MODEL_ROOT: /app/models
      YOLO_MODEL_PATH: /app/models/component/best.pt
      PIN_MODEL_PATH: /app/models/pin/best.pt
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro

  worker:
    build: .
    command: celery -A app.core.celery_app:celery_app worker -Q pipeline -c 1 --loglevel=info
    env_file: .env
    environment:
      LABGUARDIAN_MODEL_ROOT: /app/models
      YOLO_MODEL_PATH: /app/models/component/best.pt
      PIN_MODEL_PATH: /app/models/pin/best.pt
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
