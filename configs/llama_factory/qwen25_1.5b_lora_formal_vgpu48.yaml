# LabGuardian formal student SFT config for a 48GB vGPU machine.
# Usage:
#   llamafactory-cli train configs/llama_factory/qwen25_1.5b_lora_formal_vgpu48.yaml

### model
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### dataset
dataset_dir: datasets/distill
# Replace with your final expanded dataset entry in datasets/distill/dataset_info.json.
dataset: labguardian_train_alpaca
template: qwen
cutoff_len: 3072
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: outputs/llamafactory/qwen25_1.5b_lora_labguardian_formal_v1
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: false

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
optim: adamw_torch
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
report_to: none

### eval
val_size: 0.05
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 200

### generation
predict_with_generate: false

### extras
include_num_input_tokens_seen: true
