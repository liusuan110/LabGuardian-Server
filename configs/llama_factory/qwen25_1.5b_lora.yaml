# LabGuardian distillation SFT config for LLaMA-Factory.
# Usage:
#   llamafactory-cli train configs/llama_factory/qwen25_1.5b_lora.yaml

### model
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### dataset
dataset_dir: datasets/distill
dataset: labguardian_pilot20_alpaca
template: qwen
# Keep the sequence length conservative for RTX 4060 laptop smoke runs.
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 2

### output
output_dir: outputs/llamafactory/qwen25_1.5b_lora_labguardian_pilot20
logging_steps: 5
save_steps: 50
plot_loss: true
overwrite_output_dir: true
save_only_model: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
optim: adamw_torch
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
report_to: none

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50

### generation
predict_with_generate: false

### extras
include_num_input_tokens_seen: true
